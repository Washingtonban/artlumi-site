name: Bastidores

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Testar seleção
        run: node --test scripts/
      - name: Atualizar Bastidores
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          if [ -n "$IG_TOKEN" ]; then echo "::add-mask::$IG_TOKEN"; fi
          node scripts/atualizar-bastidores.mjs
      - name: Commitar alterações dos Bastidores
        run: |
          git add assets/bastidores.json assets/img/bastidores/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Bastidores atualizados pelo Instagram"
            git push
          fi
      - name: Renovar token no dia 1
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$(date -u +%d)" != "01" ]; then exit 0; fi
          if [ -z "$GH_PAT" ]; then echo "GH_PAT ausente; renovação mensal ignorada."; exit 0; fi
          echo "::add-mask::$IG_TOKEN"
          echo "::add-mask::$GH_PAT"
          node scripts/renovar-token.mjs
